<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Genshin Map Zoom Extender</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-row">
      <span class="icon">🔍</span>
      <h1>Genshin Map Zoom</h1>
    </div>
    <span class="version">v1.0.0</span>
  </div>

  <div class="card">
    <div class="control-group toggle-group">
      <label for="enable-toggle">Ativar Zoom Estendido</label>
      <label class="switch">
        <input type="checkbox" id="enable-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>
  </div>

  <div class="card" id="settings-card">
    <div class="control-group">
      <div class="label-row">
        <label for="max-zoom-slider">Zoom Máximo:</label>
        <span id="max-zoom-val" class="badge">20</span>
      </div>
      <input type="range" id="max-zoom-slider" min="16" max="22" value="20" step="1">
      <div class="scale-labels">
        <span>16 (2x)</span>
        <span>18 (8x)</span>
        <span>20 (32x)</span>
        <span>22 (128x)</span>
      </div>
    </div>

    <div class="control-group">
      <label for="render-mode-select">Filtro de Imagem (Upscaling):</label>
      <select id="render-mode-select">
        <option value="auto">Suave (Bilinear - Padrão)</option>
        <option value="pixelated">Nítido (Pixelado)</option>
      </select>
    </div>

    <div class="control-group toggle-group">
      <label for="hud-toggle">Exibir Indicador (HUD) na Tela</label>
      <label class="switch">
        <input type="checkbox" id="hud-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="btn-reset" class="btn-secondary">Resetar Padrões</button>
  </div>

  <div class="footer">
    <p>Para o site <a href="https://genshin-impact-map.appsample.com/" target="_blank">appsample.com</a></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
